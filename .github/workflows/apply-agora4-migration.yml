name: Aplicar migração Ágora 4 temporária

on:
  push:
    branches:
      - feature/v1-agora4-tailwind4
    paths:
      - ".github/workflows/apply-agora4-migration.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar patch validado no RDC
        run: |
          git apply --check .migration/agora4.patch
          git apply .migration/agora4.patch

      - name: Regenerar lockfile no ambiente do CI
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Remover transporte temporário e validar diff
        run: |
          rm -rf .migration
          git diff --check
          git status --short

      - name: Publicar código da migração na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(v1): alinha Agora 4 e Tailwind 4 ao portal oficial"
          git push origin HEAD:feature/v1-agora4-tailwind4
