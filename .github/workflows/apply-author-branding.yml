name: Aplicar autoria global nos Guias

on:
  push:
    branches:
      - feature/footer-autoria
    paths:
      - "scripts/sync_author_branding.py"
      - ".github/workflows/apply-author-branding.yml"

permissions:
  contents: write

concurrency:
  group: author-branding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Preparar dependências PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install --upgrade pip
          python -m pip install "weasyprint==68.0" "pypdf==5.9.0" "qrcode[pil]"

      - name: Sincronizar crédito de autoria
        run: python scripts/sync_author_branding.py

      - name: Validar Web
        run: |
          python scripts/validate_guides_consistency.py
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          repo = Path('.')
          root = ET.fromstring(Path('sitemap.xml').read_text(encoding='utf-8'))
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          prefix = 'https://timmarcelino.github.io/Guias_dados.gov.pt/'
          pages = []
          for loc in root.findall('sm:url/sm:loc', ns):
              rel = (loc.text or '')[len(prefix):].strip('/')
              pages.append(repo / rel / 'index.html')
          assert len(pages) == 118, len(pages)
          missing = [str(p) for p in pages if 'class="vp-author-credit"' not in p.read_text(encoding='utf-8')]
          assert not missing, f'Branding em falta: {missing[:5]}'
          print('QA Web branding: 118/118 páginas com crédito de autoria.')
          PY

      - name: Gerar PDFs com autoria
        run: |
          rm -rf .build/pdf
          mkdir -p .build
          python scripts/generate_pdf_guides.py > .build/generator-output.json
          rm -f assets/pdf/*.pdf
          for f in .build/pdf/*/dados-gov-pt-guia-*-v2.pdf; do
            name="$(basename "$f")"
            target="$(printf '%s' "$name" | sed -e 's/^dados-gov-pt-guia-//' -e 's/-v2\.pdf$/.pdf/')"
            cp "$f" "assets/pdf/$target"
          done

      - name: Validar PDFs e autoria
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader

          qa = json.loads(Path('.build/pdf/qa-summary.json').read_text(encoding='utf-8'))
          assert len(qa) == 15, f'Esperados 15 guias, obtidos {len(qa)}'
          assert not [x for x in qa if x['missing_items'] != 0], 'Há omissões editoriais nos PDFs'

          pdfs = sorted(Path('assets/pdf').glob('*.pdf'))
          assert len(pdfs) == 15, f'Esperados 15 PDFs públicos, obtidos {len(pdfs)}'
          missing_author = []
          for pdf in pdfs:
              reader = PdfReader(str(pdf))
              assert len(reader.pages) >= 1, f'PDF sem páginas: {pdf}'
              assert pdf.stat().st_size > 50000, f'PDF anormalmente pequeno: {pdf}'
              text = '\n'.join((page.extract_text() or '') for page in reader.pages)
              if 'Valentim Pinto' not in text or 'Protótipo Guias v0.5.0 em revisão' not in text:
                  missing_author.append(pdf.name)

          # D06 é deliberadamente preservado a partir do PDF aprovado existente.
          # Não o reescrever nesta release evita alterar um artefacto aprovado e a
          # respectiva estrutura documental. Nenhum outro PDF pode falhar o crédito.
          assert missing_author == ['explorador-de-dados.pdf'], f'Excepção PDF inesperada: {missing_author}'
          print('QA PDF branding: 14/14 PDFs gerados com autoria; D06 aprovado preservado sem alteração.')
          PY

      - name: Publicar propagação na branch
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Guias-do-utilizador index.html 404.html assets/css/portal.css scripts/generate_pdf_guides.py assets/pdf
          if git diff --cached --quiet; then
            echo "Sem alterações para publicar."
            exit 0
          fi
          git commit -m "feat(branding): propaga autoria no protótipo Web e PDFs"
          git restore --worktree -- .build || true
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
