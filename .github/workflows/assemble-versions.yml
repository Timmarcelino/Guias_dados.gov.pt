name: Organizar versoes dos guias

on:
  push:
    branches:
      - setup/versionamento

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Montar versoes HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p versions/v0.1 versions/v0.2 versions/v0.3

          cp index.html versions/v0.1/index.html
          cat .parts/v02/part-* | base64 --decode | gzip --decompress > versions/v0.2/index.html
          cat .parts/v03/part-* | base64 --decode | gzip --decompress > versions/v0.3/index.html
          cp versions/v0.3/index.html index.html

          test "$(wc -c < versions/v0.1/index.html)" -eq 115412
          test "$(wc -c < versions/v0.2/index.html)" -eq 127362
          test "$(wc -c < versions/v0.3/index.html)" -eq 134591
          cmp --silent index.html versions/v0.3/index.html

          rm -rf .parts

      - name: Registar estrutura versionada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Organiza prototipos por versao"
          git push
