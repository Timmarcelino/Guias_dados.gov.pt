name: Finalizar prototipo v0.4

on:
  push:
    branches:
      - feature/v0.4-header-footer-refactor

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositorio
        uses: actions/checkout@v4

      - name: Separar dados editoriais e criar snapshot v0.4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil

          source = Path('versions/v0.3/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', source, re.S | re.I)
          if not scripts:
              raise SystemExit('Script da v0.3 não encontrado')
          script = scripts[-1]

          guides_start = script.index('const guides=') + len('const guides=')
          guides_end = script.index(';\n const themes=', guides_start)
          guides_expr = script[guides_start:guides_end]

          themes_start = guides_end + len(';\n const themes=')
          themes_end = script.index(';\n const themeForCode=', themes_start)
          themes_expr = script[themes_start:themes_end]

          data = (
              '// Dados de conteúdo do protótipo.\n'
              '// Mantém os conteúdos editoriais separados da lógica de apresentação.\n\n'
              'export const guides = ' + guides_expr + ';\n\n'
              'export const themes = ' + themes_expr + ';\n'
          )
          Path('assets/js/data.js').write_text(data, encoding='utf-8')

          raw_guides = guides_expr.split('.filter', 1)[0]
          guides = json.loads(raw_guides)
          assert len(guides) == 13, f'Esperados 13 guias, obtidos {len(guides)}'
          total_cards = sum(len(guide['fichas']) for guide in guides)
          assert total_cards == 80, f'Esperadas 80 fichas, obtidas {total_cards}'

          snapshot = Path('versions/v0.4')
          if snapshot.exists():
              shutil.rmtree(snapshot)
          (snapshot / 'assets/css').mkdir(parents=True)
          (snapshot / 'assets/js').mkdir(parents=True)
          shutil.copy2('index.html', snapshot / 'index.html')
          for name in ('base.css', 'portal.css', 'guides.css'):
              shutil.copy2(Path('assets/css') / name, snapshot / 'assets/css' / name)
          for name in ('data.js', 'app.js', 'header.js'):
              shutil.copy2(Path('assets/js') / name, snapshot / 'assets/js' / name)

          print(f'Validação: {len(guides)} guias e {total_cards} fichas')
          PY

      - name: Validar JavaScript e estrutura
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/data.js
          node --check assets/js/app.js
          node --check assets/js/header.js
          test -f versions/v0.4/index.html
          test -f versions/v0.4/assets/js/data.js
          test -f versions/v0.4/assets/css/guides.css
          cmp --silent assets/js/data.js versions/v0.4/assets/js/data.js
          cmp --silent assets/css/guides.css versions/v0.4/assets/css/guides.css

      - name: Registar dados e snapshot v0.4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/data.js versions/v0.4
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Preserva snapshot autocontido da v0.4"
          git push
