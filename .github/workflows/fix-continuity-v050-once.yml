name: Corrigir continuidade v0.5.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-continuity-v050-once.yml"

permissions:
  contents: write

jobs:
  fix-continuity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Corrigir estado corrente do Secretário
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/PROJECT_STATUS.md')
          text = path.read_text(encoding='utf-8')

          # O topo passa a descrever a baseline actual, não a branch já promovida.
          old_rows = '\n'.join([
              '| Relação com `main` | Confirmar no início de cada retoma; a branch activa deriva integralmente da baseline v0.4 |',
              '| Guias | 15 |',
              '| Fichas na baseline estável v0.4 | 91 |',
              '| Fichas na branch activa | 95 |',
          ])
          new_rows = '\n'.join([
              '| Relação com `main` | v0.5.0 integrada; próxima branch de evolução ainda Por confirmar |',
              '| Guias | 15 |',
              '| Fichas na baseline estável actual | 95 |',
          ])
          assert old_rows in text, 'Linhas antigas do estado resumido não encontradas'
          text = text.replace(old_rows, new_rows, 1)

          # A antiga feature branch deixa de ser apresentada como trabalho corrente.
          old_intro = '\n'.join([
              '## 3. Branch activa',
              '',
              '### Implementação',
              '',
              'O trabalho corrente encontra-se em:',
              '',
              '`feature/static-routes-pdf`',
              '',
              'Esta branch parte integralmente da baseline v0.4 e contém evolução posterior ainda não integrada em `main`.',
              '',
              '### Alterações já existentes na branch',
              '',
              'A comparação com `main` evidencia, entre outros:',
              '',
              '* rotas estáticas em `Guias-do-utilizador/`;',
              '* páginas próprias para temas, guias e tarefas;',
              '* índice de pesquisa em `assets/js/search-index.json`;',
              '* lógica de pesquisa em `assets/js/search.js`;',
              '* PDFs dos 15 guias em `assets/pdf/`;',
              '* `sitemap.xml`;',
              '* `404.html`;',
              '* `.nojekyll`;',
              '* evolução do `index.html`.',
              '',
              'Por confirmar: comportamento completo, acessibilidade, qualidade editorial e prontidão destas alterações para integração em `main`.',
          ]) + '\n'
          new_intro = '\n'.join([
              '## 3. Estado após a release v0.5.0',
              '',
              '### Implementação',
              '',
              'O trabalho consolidado da v0.5.0 encontra-se em `main`.',
              '',
              'A branch `feature/static-routes-pdf` foi a origem do PR #5 e deixou de ser a referência activa após o merge. A branch da próxima evolução está **Por confirmar**.',
              '',
              'A baseline actual inclui, entre outros:',
              '',
              '* rotas estáticas em `Guias-do-utilizador/`;',
              '* páginas próprias para temas, guias e tarefas;',
              '* índice de pesquisa em `assets/js/search-index.json`;',
              '* lógica de pesquisa em `assets/js/search.js`;',
              '* PDFs dos 15 guias em `assets/pdf/`;',
              '* `sitemap.xml`;',
              '* `404.html`;',
              '* `.nojekyll`;',
              '* fonte editorial e workflows permanentes de QA e PDF.',
              '',
              'As limitações conhecidas da v0.5.0 estão registadas no checkpoint de release e transitam para a próxima evolução sem alteração do respectivo estado funcional.',
          ]) + '\n'
          assert old_intro in text, 'Introdução antiga da branch activa não encontrada'
          text = text.replace(old_intro, new_intro, 1)

          old_generator = '* Por confirmar: o processo que gera rotas estáticas e PDFs não está versionado no repositório. Deve ser incorporado antes de nova regeneração para evitar reintrodução de defeitos já corrigidos.'
          new_generator = ('* O gerador PDF e os workflows permanentes estão versionados e foram validados na v0.5.0. '
                           'A automatização integral da geração das rotas estáticas pode ser aprofundada na próxima evolução, '
                           'sem afectar o guardrail actual que valida as 118 rotas publicadas.')
          assert old_generator in text, 'Nota antiga sobre geração não encontrada'
          text = text.replace(old_generator, new_generator, 1)

          path.write_text(text, encoding='utf-8')
          print('Resíduos de continuidade corrigidos.')
          PY

      - name: Validar estado corrente
        run: |
          grep -q "Fichas na baseline estável actual | 95" docs/PROJECT_STATUS.md
          grep -q "## 3. Estado após a release v0.5.0" docs/PROJECT_STATUS.md
          grep -q "próxima branch de evolução ainda Por confirmar" docs/PROJECT_STATUS.md
          ! grep -q "O trabalho corrente encontra-se em:" docs/PROJECT_STATUS.md

      - name: Publicar correcção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md
          git commit -m "docs(release): alinha continuidade com main v0.5.0"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
