name: Corrigir navegação e scroll v0.4

on:
  push:
    branches:
      - feature/v0.4-header-footer-refactor

permissions:
  contents: write

jobs:
  fix-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Corrigir reposicionamento entre vistas
        shell: python
        run: |
          from pathlib import Path
          import shutil

          path = Path('assets/js/app.js')
          text = path.read_text(encoding='utf-8')

          marker = " }\n function openGuide(gi,fi=-1){state.guide=gi;state.ficha=fi;state.home=false;$('#dg-query').value='';render();}"
          replacement = " }\n function resetView(){requestAnimationFrame(()=>{const main=$('main'),header=document.querySelector('.portal-header');if(!main)return;const offset=(header?.getBoundingClientRect().height||0)+24;const top=main.getBoundingClientRect().top+window.scrollY-offset;window.scrollTo({top:Math.max(0,top),behavior:'auto'});const title=main.querySelector('h1');if(title){title.setAttribute('tabindex','-1');title.focus({preventScroll:true});}});}\n function openGuide(gi,fi=-1){state.guide=gi;state.ficha=fi;state.home=false;$('#dg-query').value='';render();resetView();}"
          if marker not in text:
              raise SystemExit('Ponto de inserção de resetView não encontrado')
          text = text.replace(marker, replacement, 1)

          replacements = [
              ("state.home=false;state.ficha=Number(b.dataset.ficha);render();", "state.home=false;state.ficha=Number(b.dataset.ficha);render();resetView();"),
              ("state.ficha=Number(e.target.value);render();});", "state.ficha=Number(e.target.value);render();resetView();});"),
              ("state.home=true;state.ficha=-1;$('#dg-query').value='';render();});", "state.home=true;state.ficha=-1;$('#dg-query').value='';render();resetView();});"),
              ("if(!q){render();return;}", "if(!q){render();resetView();return;}"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Trecho esperado não encontrado: {old}')
              text = text.replace(old, new, 1)

          search_end = "${hits.length?grouped.map(x=>`<h2 class=\"dg-search-theme\">${esc(x.theme.title)}</h2><div class=\"dg-grid\">${x.hits.map(h=>card(h.f,h.i,h.gi)).join('')}</div>`).join(''):'<p>Experimente menos palavras ou outra expressão.</p>'}`;"
          if search_end not in text:
              raise SystemExit('Fim da renderização de pesquisa não encontrado')
          text = text.replace(search_end, search_end + "\n  resetView();", 1)

          path.write_text(text, encoding='utf-8')
          shutil.copy2(path, Path('versions/v0.4/assets/js/app.js'))

      - name: Validar JavaScript e sincronização
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/app.js
          node --check versions/v0.4/assets/js/app.js
          cmp assets/js/app.js versions/v0.4/assets/js/app.js
          grep -q "function resetView" assets/js/app.js
          grep -q "render();resetView();" assets/js/app.js

      - name: Registar correcção
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js versions/v0.4/assets/js/app.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Corrige navegação e reposicionamento entre vistas"
          git push
