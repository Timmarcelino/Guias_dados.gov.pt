name: Fechar checkpoint release v0.5.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/post-release-v050-once.yml"

permissions:
  contents: write

jobs:
  close-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Actualizar continuidade pós release
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # README passa de linguagem de candidatura a linguagem de baseline já integrada.
          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old = ('A release **v0.5.0** consolida a evolução preparada na branch `feature/static-routes-pdf` '
                 'para integração em `main` através do PR #5. Inclui rotas estáticas, pesquisa indexada, '
                 'PDFs, validação automática de consistência e documentação viva do estado do projecto. '
                 'Após a promoção, `main` passa a representar esta baseline de demonstração e revisão. '
                 'A publicação oficial no dados.gov.pt continua dependente da integração no produto.')
          new = ('A release **v0.5.0** está integrada em `main` através do PR #5 e representa a baseline estável '
                 'actual de demonstração e revisão. Inclui rotas estáticas, pesquisa indexada, PDFs, validação '
                 'automática de consistência e documentação viva do estado do projecto. A publicação oficial '
                 'no dados.gov.pt continua dependente da integração no produto.')
          assert old in readme, 'Estado pré merge do README não encontrado'
          readme_path.write_text(readme.replace(old, new, 1), encoding='utf-8')

          # CONTENT_VALIDATION mantém os estados funcionais, alterando apenas o facto
          # operacional da release: deixou de estar aprovada para integração e passou a main.
          validation_path = Path('docs/CONTENT_VALIDATION.md')
          validation = validation_path.read_text(encoding='utf-8')
          old_line = 'A release v0.5.0 foi aprovada para integração em `main` com o conteúdo actualmente consolidado dos 15 guias e 95 fichas.'
          new_line = ('A release v0.5.0 foi integrada em `main` pelo PR #5 em 23/09/2026 com o conteúdo consolidado '
                      'dos 15 guias e 95 fichas. O merge da release corresponde ao commit '
                      '`260034099ae643c4ee06139671ab5ad8ecd0a82c`.')
          assert old_line in validation, 'Estado pré merge de CONTENT_VALIDATION não encontrado'
          validation = validation.replace(old_line, new_line, 1)
          validation_path.write_text(validation, encoding='utf-8')

          # PROJECT_STATUS é o ponto principal de continuidade. Actualizar o topo e
          # substituir a secção de candidatura por um checkpoint pós release fechado.
          status_path = Path('docs/PROJECT_STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          old_rows = ('| Baseline estável antes desta release | v0.4 |\n'
                      '| Commit da baseline v0.4 | `58c65e205c38ad810e122a57f2dff4b612aa39dd` |\n'
                      '| Branch activa de evolução | `feature/static-routes-pdf` |\n'
                      '| Release candidata | `v0.5.0` |\n'
                      '| Promoção para `main` | PR #5, aprovada em 23/09/2026 |')
          new_rows = ('| Baseline estável actual | `v0.5.0` |\n'
                      '| Commit de merge da release | `260034099ae643c4ee06139671ab5ad8ecd0a82c` |\n'
                      '| Commit pós merge dos PDFs | `329e6e2ce9623545f3524d79c97167ecc61b4a8f` |\n'
                      '| Baseline anterior | `v0.4`, commit `58c65e205c38ad810e122a57f2dff4b612aa39dd` |\n'
                      '| Branch de origem da release | `feature/static-routes-pdf` |\n'
                      '| PR de promoção | #5, integrado em 23/09/2026 |\n'
                      '| Branch activa para próxima evolução | Por confirmar |')
          assert old_rows in status, 'Tabela de estado pré merge não encontrada'
          status = status.replace(old_rows, new_rows, 1)

          checkpoint_lines = [
              '## Release v0.5.0 integrada em main',
              '',
              'Checkpoint pós release: 23/09/2026.',
              '',
              '### Resultado da promoção',
              '',
              '* PR #5 integrado com sucesso em `main`;',
              '* commit de merge: `260034099ae643c4ee06139671ab5ad8ecd0a82c`;',
              '* workflow PDF executado em `main` e sincronização publicada no commit `329e6e2ce9623545f3524d79c97167ecc61b4a8f`;',
              '* guardrail pós merge: execução `35853966260`, sucesso;',
              '* workflow PDF pós merge: execução `35853966165`, sucesso.',
              '',
              '### Baseline v0.5.0',
              '',
              '* 15 guias;',
              '* 95 fichas;',
              '* 7 temas;',
              '* 118 rotas estáticas e 118 URLs de sitemap;',
              '* 95 entradas de pesquisa;',
              '* 15 PDFs;',
              '* workflows permanentes activos em `main` para consistência e PDFs.',
              '',
              '### Limitações conhecidas transferidas para a próxima release',
              '',
              'As limitações seguintes permanecem abertas e não são consideradas resolvidas:',
              '',
              '1. D06 sem integração pública reproduzível nas superfícies PRD/PPR analisadas;',
              '2. D07 sem integração observável nas superfícies analisadas;',
              '3. CM sem integração observável nas superfícies analisadas;',
              '4. validação manual final com NVDA no contexto final;',
              '5. revisão visual detalhada e validação documental final dos PDFs;',
              '6. evoluções e correcções funcionais posteriores à baseline.',
              '',
              'A transferência destas limitações para a próxima release é uma decisão de âmbito. Não altera o respectivo estado funcional.',
              '',
              '### Publicação oficial',
              '',
              'A v0.5.0 em `main` é a baseline estável de demonstração e revisão. Não representa, por si só, publicação oficial no dados.gov.pt.',
              '',
              '### Próxima evolução',
              '',
              'A branch e o âmbito da próxima release devem ser definidos antes de novos desenvolvimentos. D06, D07, CM, validação final dos PDFs e novas correcções/evoluções constituem a fila inicial conhecida.',
              '',
          ]
          checkpoint = '\n'.join(checkpoint_lines) + '\n'
          pattern = r'## Prontidão para integração e release v0\.5\.0\n.*?(?=## Sincronização documental corrente 22/09/2026)'
          status, count = re.subn(pattern, checkpoint, status, count=1, flags=re.S)
          assert count == 1, 'Secção de candidatura v0.5.0 não encontrada'
          status_path.write_text(status, encoding='utf-8')

          print('Checkpoint pós release v0.5.0 actualizado.')
          PY

      - name: Validar checkpoint
        run: |
          grep -q "Baseline estável actual | \`v0.5.0\`" docs/PROJECT_STATUS.md
          grep -q "Release v0.5.0 integrada em main" docs/PROJECT_STATUS.md
          grep -q "está integrada em \`main\` através do PR #5" README.md
          grep -q "foi integrada em \`main\` pelo PR #5" docs/CONTENT_VALIDATION.md

      - name: Publicar checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/CONTENT_VALIDATION.md docs/PROJECT_STATUS.md
          git commit -m "docs(release): fecha checkpoint v0.5.0 em main"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
