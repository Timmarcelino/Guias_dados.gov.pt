name: Preparar documentação release v0.5.0

on:
  push:
    branches:
      - feature/static-routes-pdf
    paths:
      - ".github/workflows/prepare-release-v050-once.yml"

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/static-routes-pdf
          fetch-depth: 0

      - name: Actualizar documentação de release
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # README: actualizar o estado corrente e acrescentar a nova referência de release
          # sem criar uma pasta versions/v0.5, porque o histórico Git continua a ser a fonte
          # técnica principal de versionamento.
          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          old_state = ('A `main` preserva a referência estável v0.4. A evolução corrente é preparada na branch '
                       '`feature/static-routes-pdf`, que acrescenta rotas estáticas, pesquisa indexada, PDFs, '
                       'validação automática de consistência e documentação viva do estado do projecto.')
          new_state = ('A release **v0.5.0** consolida a evolução preparada na branch `feature/static-routes-pdf` '
                       'para integração em `main` através do PR #5. Inclui rotas estáticas, pesquisa indexada, '
                       'PDFs, validação automática de consistência e documentação viva do estado do projecto. '
                       'Após a promoção, `main` passa a representar esta baseline de demonstração e revisão. '
                       'A publicação oficial no dados.gov.pt continua dependente da integração no produto.')
          assert old_state in readme, 'Estado actual do README não encontrado'
          readme = readme.replace(old_state, new_state, 1)
          v04 = '| `v0.4` | Modularização técnica, aproximação do header e footer, integração de D14 e D01 e evolução da taxonomia para sete temas. |'
          v05 = ('| `v0.5.0` | 15 guias, 95 fichas, 118 rotas estáticas, 15 PDFs, guardrails de consistência, '
                 'alinhamento editorial com PRD/PPR e workflows permanentes preparados para `main`. |')
          assert v04 in readme, 'Linha v0.4 do README não encontrada'
          if v05 not in readme:
              readme = readme.replace(v04, v04 + '\n' + v05, 1)
          readme_path.write_text(readme, encoding='utf-8')

          # CHANGELOG: transformar a secção em desenvolvimento numa release explícita e
          # registar as limitações conhecidas que foram conscientemente transferidas para
          # a release seguinte. Isto não altera o estado funcional dessas áreas.
          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          changelog = changelog.replace('## Em desenvolvimento · 22/09/2026', '## v0.5.0 · 23/09/2026', 1)
          changelog = changelog.replace(
              'Evolução da branch `feature/static-routes-pdf` após a referência v0.4.',
              'Release de demonstração e revisão preparada a partir da branch `feature/static-routes-pdf` para promoção a `main` pelo PR #5.',
              1,
          )
          old_qa = '* QA estrutural sobre 115 páginas: 115/115 HTTP 200 e 134 ligações internas sem quebras.'
          new_qa = ('* Guardrail final validado sobre **118 páginas HTML**, 95 entradas de pesquisa e 118 URLs de sitemap. '
                    'A ronda HTTP anterior à expansão confirmou 115/115 páginas e 134 ligações internas sem quebras.')
          assert old_qa in changelog, 'Bullet QA histórico não encontrado'
          changelog = changelog.replace(old_qa, new_qa, 1)
          workflow_bullet = ('* Correcção do workflow PDF permanente: limpeza dos artefactos temporários de `.build` antes do `rebase`, '
                             'publicação concorrente controlada por branch e suporte equivalente para `main` e para a branch de evolução.')
          marker = '* Criação do guardrail `scripts/validate_guides_consistency.py` e workflow de CI para validar fonte, rotas, pesquisa, sitemap e estrutura HTML.'
          assert marker in changelog, 'Marcador de guardrail não encontrado'
          if workflow_bullet not in changelog:
              changelog = changelog.replace(marker, marker + '\n' + workflow_bullet, 1)
          old_pending = ('Por confirmar antes de publicação oficial: testes PRD autenticados aplicáveis, validação manual com NVDA, '
                         'revisão visual final dos PDFs e acessibilidade documental interna dos PDFs.')
          new_pending = ('Limitações conhecidas transferidas para a próxima release: integração efectiva de D06 no Frontoffice; '
                         'observabilidade de D07 e CM; validação manual final com NVDA; revisão visual detalhada e validação documental '
                         'dos PDFs; e evoluções funcionais ou correcções que surjam após esta baseline. Esta decisão de âmbito não '
                         'equivale a validar funcionalmente essas limitações nem transforma o protótipo em publicação oficial.')
          assert old_pending in changelog, 'Bloco de pendências do CHANGELOG não encontrado'
          changelog = changelog.replace(old_pending, new_pending, 1)
          changelog_path.write_text(changelog, encoding='utf-8')

          # CONTENT_VALIDATION: registar explicitamente que a decisão de release é uma
          # decisão de âmbito e não uma promoção artificial dos estados de validação.
          validation_path = Path('docs/CONTENT_VALIDATION.md')
          validation = validation_path.read_text(encoding='utf-8')
          release_block = '''## 2.1 Decisão de âmbito da release v0.5.0, 23/09/2026

A release v0.5.0 foi aprovada para integração em `main` com o conteúdo actualmente consolidado dos 15 guias e 95 fichas.

Esta decisão é uma **decisão de release** e não altera a classificação funcional das áreas ainda não observáveis ou não integradas:

* D06 permanece não integrado no Frontoffice actual observado;
* D07 permanece não observável nas superfícies analisadas;
* CM permanece não observável nas superfícies analisadas;
* a validação manual final com NVDA e a revisão visual e documental detalhada dos PDFs transitam para a release seguinte.

Os guias destas áreas permanecem como conteúdo preparado no protótipo e não devem ser interpretados como prova de disponibilidade actual no portal.

A release mantém a natureza de **baseline de demonstração e revisão**. A publicação oficial no dados.gov.pt continua dependente da integração no produto e das validações aplicáveis ao contexto final.

'''
          anchor = '## 3. Validação dos PDFs\n'
          assert anchor in validation, 'Secção de PDF não encontrada em CONTENT_VALIDATION'
          if '## 2.1 Decisão de âmbito da release v0.5.0' not in validation:
              validation = validation.replace(anchor, release_block + anchor, 1)
          validation_path.write_text(validation, encoding='utf-8')

          # PROJECT_STATUS: substituir a secção antiga de prontidão, que bloqueava o merge,
          # pela decisão de release actualmente aprovada. O histórico das validações é
          # preservado nas restantes secções datadas.
          status_path = Path('docs/PROJECT_STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          status = status.replace('| Baseline estável | v0.4 |', '| Baseline estável antes desta release | v0.4 |', 1)
          status = status.replace('| Commit da baseline | `58c65e205c38ad810e122a57f2dff4b612aa39dd` |', '| Commit da baseline v0.4 | `58c65e205c38ad810e122a57f2dff4b612aa39dd` |', 1)
          top_anchor = '| Branch activa de evolução | `feature/static-routes-pdf` |'
          assert top_anchor in status, 'Linha da branch activa não encontrada'
          release_rows = ('| Release candidata | `v0.5.0` |\n'
                          '| Promoção para `main` | PR #5, aprovada em 23/09/2026 |')
          if '| Release candidata | `v0.5.0` |' not in status:
              status = status.replace(top_anchor, top_anchor + '\n' + release_rows, 1)

          new_readiness = '''## Prontidão para integração e release v0.5.0

Estado revisto em 23/09/2026.

### Decisão de release

Foi aprovada a promoção do estado actualmente consolidado da branch `feature/static-routes-pdf` para `main` através do PR #5.

A release candidata v0.5.0 contém:

* 15 guias;
* 95 fichas;
* 7 temas;
* 118 rotas estáticas e 118 URLs de sitemap;
* 95 entradas de pesquisa;
* 15 PDFs gerados a partir da fonte editorial versionada;
* guardrail automático de consistência;
* workflow PDF permanente e preparado para funcionar também em `main`.

### Gates técnicos desta release

Em 23/09/2026:

* o guardrail de consistência terminou com sucesso na execução GitHub Actions `35853185102`;
* o workflow PDF permanente corrigido terminou com sucesso na execução `35853158371`, incluindo geração, QA e publicação dos PDFs;
* a branch encontrava-se sem commits em atraso face a `main` no último compare aplicável antes da preparação da release.

### Limitações conhecidas aceites para a próxima release

As seguintes limitações deixam de bloquear o merge desta baseline, mas **não são consideradas resolvidas**:

1. D06 continua sem integração pública reproduzível nas superfícies PRD/PPR analisadas;
2. D07 continua sem integração observável nas superfícies analisadas;
3. CM continua sem integração observável nas superfícies analisadas;
4. validação manual final com NVDA permanece pendente no contexto final;
5. revisão visual detalhada e validação documental final dos PDFs permanecem pendentes;
6. evoluções e correcções funcionais posteriores à baseline serão tratadas na próxima release.

Esta aceitação é uma decisão de âmbito da release. Não transforma ausência de evidência em requisito validado.

### Publicação oficial

O merge em `main` produz uma baseline estável de demonstração e revisão. Não equivale, por si só, à publicação oficial no dados.gov.pt.

A publicação oficial continua a exigir, quando aplicável:

1. confirmação do destino definitivo e integração no produto;
2. parametrização dos canonicals e caminhos quando o destino oficial for conhecido;
3. validação no contexto final do portal;
4. tratamento das limitações que forem consideradas obrigatórias para a publicação oficial.

### Decisão operacional

O PR #5 pode ser promovido a Ready for review e integrado em `main` quando os checks técnicos da preparação de release estiverem verdes e a documentação do PR estiver sincronizada com esta decisão.

'''
          pattern = r'## Prontidão para integração e publicação\n.*?(?=## Sincronização documental corrente 22/09/2026)'
          status, count = re.subn(pattern, new_readiness, status, count=1, flags=re.S)
          assert count == 1, 'Secção antiga de prontidão não foi substituída'
          status = status.replace('* `README.md` actualizado para 15 guias e 92 fichas;', '* `README.md` actualizado para 15 guias e 95 fichas;', 1)
          status = status.replace('* D14 actualizado para seis fichas;', '* D13 e D14 actualizados para sete fichas cada;', 1)
          status_path.write_text(status, encoding='utf-8')

          print('Documentação da release v0.5.0 actualizada com sucesso.')
          PY

      - name: Validar referências principais
        run: |
          grep -q "v0.5.0" README.md
          grep -q "## v0.5.0 · 23/09/2026" CHANGELOG.md
          grep -q "Decisão de âmbito da release v0.5.0" docs/CONTENT_VALIDATION.md
          grep -q "Prontidão para integração e release v0.5.0" docs/PROJECT_STATUS.md
          python scripts/validate_guides_consistency.py

      - name: Publicar documentação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/CONTENT_VALIDATION.md docs/PROJECT_STATUS.md
          git commit -m "docs(release): consolida baseline v0.5.0"
          git fetch origin feature/static-routes-pdf
          git rebase origin/feature/static-routes-pdf
          git push origin HEAD:feature/static-routes-pdf
