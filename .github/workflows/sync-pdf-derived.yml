name: Sincronizar PDFs derivados v1 temporariamente

on:
  push:
    branches:
      - chore/v1-post-merge-cleanup
    paths:
      - ".github/workflows/sync-pdf-derived.yml"

permissions:
  contents: write

jobs:
  sync-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch de cleanup
        uses: actions/checkout@v4
        with:
          ref: chore/v1-post-merge-cleanup
          fetch-depth: 0

      - name: Preparar dependências PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-inter libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install --upgrade pip
          python -m pip install "weasyprint==68.0" "pypdf==5.9.0" "qrcode[pil]"

      - name: Regenerar e instalar os 15 PDFs
        run: |
          rm -rf .build/pdf
          mkdir -p .build
          python scripts/generate_pdf_guides.py > .build/generator-output.json
          rm -f assets/pdf/*.pdf
          for f in .build/pdf/*/dados-gov-pt-guia-*-v2.pdf; do
            name="$(basename "$f")"
            target="$(printf '%s' "$name" | sed -e 's/^dados-gov-pt-guia-//' -e 's/-v2\.pdf$/.pdf/')"
            cp "$f" "assets/pdf/$target"
          done

      - name: Validar baseline PDF v1
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          pdfs = sorted(Path("assets/pdf").glob("*.pdf"))
          assert len(pdfs) == 15, f"Esperados 15 PDFs, obtidos {len(pdfs)}"
          bad = []
          for pdf in pdfs:
              text = "\n".join((p.extract_text() or "") for p in PdfReader(str(pdf)).pages)
              if "v1.0.0-rc.1" not in text or "v0.5.0" in text:
                  bad.append(pdf.name)
          assert not bad, f"Versão PDF inesperada: {bad}"
          print("QA PDF: 15/15 em v1.0.0-rc.1 e sem v0.5.0.")
          PY

      - name: Commit controlado dos derivados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pdf/*.pdf
          if git diff --cached --quiet; then
            echo "PDFs já sincronizados."
            exit 0
          fi
          git commit -m "fix(v1): actualiza PDFs derivados para rc.1"
          git push origin HEAD:chore/v1-post-merge-cleanup
