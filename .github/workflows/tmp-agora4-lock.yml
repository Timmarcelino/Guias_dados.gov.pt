name: TEMP sincronizar lockfile Agora 4

on:
  push:
    branches:
      - feat/v1-agora4-tailwind4
    paths:
      - ".github/workflows/tmp-agora4-lock.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1-agora4-tailwind4
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerar lockfile e remover configuração Tailwind 3
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git rm -f tailwind.config.ts
      - name: Commit controlado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Sem alterações a publicar."
            exit 0
          fi
          git commit -m "chore(v1): sincroniza lockfile Tailwind 4"
          git push origin HEAD:feat/v1-agora4-tailwind4
