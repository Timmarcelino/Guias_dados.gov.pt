  border-color: var(--ring);

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;

 const root=document.getElementById('dados-guides-review');
 const guides=[{&quot;code&quot;: &quot;D03&quot;, &quot;title&quot;: &quot;Encontrar e consultar dados&quot;, &quot;intro&quot;: &quot;Encontre Conjuntos de Dados, refine a pesquisa e escolha como aceder à informação.&quot;, &quot;audience&quot;: &quot;Não precisa de iniciar sessão para pesquisar e consultar Conjuntos de Dados públicos.&quot;, &quot;fichas&quot;: [{&quot;title&quot;: &quot;Encontrar dados&quot;, &quot;intro&quot;: &quot;Comece pelo tema que lhe interessa.&quot;, &quot;roles&quot;: &quot;&quot;, &quot;steps&quot;: [&quot;Aceda à área Conjuntos de Dados.&quot;, &quot;Escreva uma palavra ou expressão no campo de pesquisa.&quot;, &quot;Consulte os resultados e abra o Conjunto de Dados que lhe parece mais adequado.&quot;], &quot;example&quot;: &quot;Para procurar informação sobre transportes em Lisboa, pesquise “transportes Lisboa”.&quot;, &quot;tip&quot;: &quot;Comece com poucas palavras. Pode refinar a pesquisa depois.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura do catálogo com o campo de pesquisa destacado.&quot;, &quot;next&quot;: &quot;Pesquisar e filtrar&quot;}, {&quot;title&quot;: &quot;Pesquisar e filtrar&quot;, &quot;intro&quot;: &quot;Combine a pesquisa com os filtros disponíveis para reduzir os resultados.&quot;, &quot;roles&quot;: &quot;&quot;, &quot;steps&quot;: [&quot;Pesquise pelo tema pretendido.&quot;, &quot;Abra os filtros e aplique os critérios que lhe interessam.&quot;, &quot;Ajuste a ordenação e percorra as páginas de resultados.&quot;, &quot;Remova ou altere os filtros se a pesquisa ficar demasiado restrita.&quot;], &quot;example&quot;: &quot;Pesquise “qualidade da água” e refine os resultados com os filtros disponíveis que se adequem à sua pesquisa.&quot;, &quot;tip&quot;: &quot;Um resultado vazio pode dever-se à combinação de critérios. Retire um filtro de cada vez.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura da pesquisa e dos filtros; vídeo curto a aplicar e remover um filtro.&quot;, &quot;next&quot;: &quot;Consultar um Conjunto de Dados&quot;}, {&quot;title&quot;: &quot;Consultar um Conjunto de Dados&quot;, &quot;intro&quot;: &quot;Antes de utilizar os dados, confirme o conteúdo e as condições de utilização.&quot;, &quot;roles&quot;: &quot;&quot;, &quot;steps&quot;: [&quot;Leia o título e a descrição.&quot;, &quot;Identifique quem publicou os dados e consulte as datas e a cobertura indicadas.&quot;, &quot;Consulte a licença para compreender as condições de utilização.&quot;, &quot;Verifique os recursos e os conteúdos relacionados disponíveis.&quot;], &quot;example&quot;: &quot;Se procura acidentes rodoviários de um determinado ano, confirme o período abrangido antes de descarregar o ficheiro.&quot;, &quot;tip&quot;: &quot;O título, a descrição, as datas e a licença fazem parte dos metadados, a informação que descreve o Conjunto de Dados.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura do detalhe com entidade, datas, licença e recursos identificados.&quot;, &quot;next&quot;: &quot;Aceder aos dados&quot;}, {&quot;title&quot;: &quot;Aceder aos dados&quot;, &quot;intro&quot;: &quot;Escolha a opção adequada ao que pretende fazer com o recurso.&quot;, &quot;roles&quot;: &quot;&quot;, &quot;steps&quot;: [&quot;No detalhe do Conjunto de Dados, aceda a Ficheiros.&quot;, &quot;Escolha um recurso e seleccione Ver mais.&quot;, &quot;Consulte os separadores disponíveis e escolha a forma de acesso.&quot;], &quot;example&quot;: &quot;Use a pré-visualização para confirmar o conteúdo. Para trabalhar fora do portal, consulte Downloads. Para analisar no portal, seleccione Explorar dados, quando disponível.&quot;, &quot;tip&quot;: &quot;Nem todas as opções estão disponíveis em todos os recursos. Uma falha da pré-visualização não impede a consulta de Metadados e Downloads.&quot;, &quot;table&quot;: [[&quot;Pretendo&quot;, &quot;Opção&quot;], [&quot;Ver rapidamente o conteúdo&quot;, &quot;Pré-visualização&quot;], [&quot;Guardar o ficheiro disponibilizado&quot;, &quot;Downloads&quot;], [&quot;Aceder a uma fonte externa&quot;, &quot;Ligação do recurso&quot;], [&quot;Analisar no portal&quot;, &quot;Explorar dados&quot;]], &quot;media&quot;: &quot;Captura de um recurso expandido e vídeo curto das opções de acesso.&quot;, &quot;next&quot;: &quot;Não encontrou o que procura?&quot;}, {&quot;title&quot;: &quot;Não encontrou o que procura?&quot;, &quot;intro&quot;: &quot;Experimente outros termos ou critérios antes de concluir que os dados não existem.&quot;, &quot;roles&quot;: &quot;&quot;, &quot;steps&quot;: [&quot;Use menos palavras ou uma expressão diferente.&quot;, &quot;Remova os filtros activos.&quot;, &quot;Procure a entidade que poderá publicar os dados e consulte os conteúdos relacionados.&quot;, &quot;Se precisar de apoio, consulte Ajuda e contactos.&quot;], &quot;example&quot;: &quot;Se “rendas médias Lisboa” não devolver resultados, experimente “rendas Lisboa” ou “habitação”.&quot;, &quot;tip&quot;: &quot;Sem resultados e erro são situações diferentes. Perante um erro, tente novamente; se persistir, reporte o problema através de Ajuda e contactos.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura do estado sem resultados e da ligação a Ajuda e contactos.&quot;, &quot;next&quot;: &quot;Voltar à visão geral&quot;}]}, {&quot;code&quot;: &quot;D04&quot;, &quot;title&quot;: &quot;Publicar e gerir Conjuntos de Dados&quot;, &quot;intro&quot;: &quot;Crie um Conjunto de Dados, publique a informação e mantenha os seus metadados, estado e responsabilidade.&quot;, &quot;audience&quot;: &quot;Inicie sessão e confirme que tem permissão no contexto pessoal ou na organização onde pretende actuar.&quot;, &quot;fichas&quot;: [{&quot;title&quot;: &quot;Encontrar os Conjuntos de Dados que gere&quot;, &quot;intro&quot;: &quot;Escolha o contexto certo antes de procurar um conteúdo.&quot;, &quot;roles&quot;: &quot;Utilizador autenticado&quot;, &quot;steps&quot;: [&quot;Na área de gestão, escolha Meu perfil para os seus Conjuntos de Dados pessoais, sem organização associada, ou seleccione a organização pretendida.&quot;, &quot;Pesquise pelo título, sigla ou acrónimo, ou descrição.&quot;, &quot;Ajuste o filtro de estado, a ordenação e a paginação.&quot;, &quot;Seleccione o Conjunto de Dados para abrir o detalhe e as acções a que tem acesso.&quot;], &quot;example&quot;: &quot;Para encontrar um conteúdo arquivado de uma organização, seleccione essa organização e o filtro Arquivado.&quot;, &quot;tip&quot;: &quot;O filtro Todos apresenta Públicos e Rascunhos. Arquivados e Eliminados têm filtros próprios. O contexto Sistema exige a permissão administrativa aplicável.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura dos contextos e do filtro de estado.&quot;, &quot;next&quot;: &quot;Criar e guardar um rascunho&quot;}, {&quot;title&quot;: &quot;Criar e guardar um rascunho&quot;, &quot;intro&quot;: &quot;Prepare a informação antes de a tornar pública.&quot;, &quot;roles&quot;: &quot;Utilizador autenticado&quot;, &quot;steps&quot;: [&quot;Escolha o contexto pessoal ou a organização em que tem permissão para criar.&quot;, &quot;Inicie a criação de um Conjunto de Dados.&quot;, &quot;Preencha os metadados disponíveis e confirme a licença adequada. A licença inicial é CC BY 4.0 e pode ser alterada.&quot;, &quot;Guarde como Rascunho para continuar mais tarde.&quot;], &quot;example&quot;: &quot;Pode guardar o título e a descrição enquanto aguarda a informação necessária para completar os restantes metadados.&quot;, &quot;tip&quot;: &quot;Um Rascunho pode ser guardado com metadados obrigatórios em falta. O conteúdo ainda não fica disponível ao público.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura da criação e da acção de guardar rascunho.&quot;, &quot;next&quot;: &quot;Publicar um Conjunto de Dados&quot;}, {&quot;title&quot;: &quot;Publicar um Conjunto de Dados&quot;, &quot;intro&quot;: &quot;A publicação torna o conteúdo público imediatamente após a conclusão.&quot;, &quot;roles&quot;: &quot;Utilizador autenticado&quot;, &quot;steps&quot;: [&quot;Abra o Rascunho que pretende publicar.&quot;, &quot;Complete os metadados obrigatórios assinalados no formulário e reveja a informação.&quot;, &quot;Se pretende disponibilizar ficheiros ou ligações, adicione os recursos e confirme os respectivos metadados.&quot;, &quot;Seleccione a acção de publicar e verifique o resultado.&quot;], &quot;example&quot;: &quot;Depois de completar os metadados de um Conjunto de Dados sobre transportes, publique-o e confirme a informação apresentada ao público.&quot;, &quot;tip&quot;: &quot;Pode publicar sem recursos, após o aviso apresentado. A ausência de modelo ou validação, Não conforme e Erro técnico também não bloqueiam a publicação. Não existe aprovação editorial intermédia no portal.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura da revisão e publicação, incluindo o aviso de ausência de recursos.&quot;, &quot;next&quot;: &quot;Editar a informação publicada&quot;}, {&quot;title&quot;: &quot;Editar a informação publicada&quot;, &quot;intro&quot;: &quot;Mantenha os metadados actualizados no contexto em que tem permissão.&quot;, &quot;roles&quot;: &quot;Utilizador autenticado&quot;, &quot;steps&quot;: [&quot;Abra o Conjunto de Dados e seleccione a edição.&quot;, &quot;Altere os metadados necessários. A licença existente mantém-se, salvo alteração explícita.&quot;, &quot;Quando o produtor é uma organização, preencha o contacto se for útil; este campo é opcional.&quot;, &quot;Reveja e guarde as alterações.&quot;], &quot;example&quot;: &quot;Actualize a descrição para esclarecer a cobertura dos dados, mantendo a licença quando as condições de utilização não mudaram.&quot;, &quot;tip&quot;: &quot;Num Conjunto de Dados público, as alterações guardadas têm efeito imediato. Cancelar antes de guardar descarta as alterações. O portal não disponibiliza versões recuperáveis dos metadados.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura dos metadados em edição.&quot;, &quot;next&quot;: &quot;Arquivar e voltar a disponibilizar&quot;}, {&quot;title&quot;: &quot;Arquivar e voltar a disponibilizar&quot;, &quot;intro&quot;: &quot;Arquive um Conjunto de Dados público quando pretende retirá-lo das listagens públicas.&quot;, &quot;roles&quot;: &quot;Utilizador autenticado&quot;, &quot;steps&quot;: [&quot;Abra o Conjunto de Dados público no contexto autorizado.&quot;, &quot;Seleccione a acção de arquivar e conclua a operação apresentada.&quot;, &quot;Para o voltar a incluir nas listagens públicas, localize-o com o filtro Arquivado.&quot;, &quot;Seleccione a acção de desarquivar. O estado regressa a Público.&quot;], &quot;example&quot;: &quot;Pode arquivar um conteúdo que deixou de ser actualizado e desarquivá-lo quando voltar a ser pertinente.&quot;, &quot;tip&quot;: &quot;Arquivar retira o conteúdo das listagens públicas, mas mantém o acesso aplicável por ligação directa. Não use o arquivo como garantia de retirada total de acesso.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura das acções e dos estados Público e Arquivado.&quot;, &quot;next&quot;: &quot;Transferir a responsabilidade&quot;}, {&quot;title&quot;: &quot;Transferir a responsabilidade&quot;, &quot;intro&quot;: &quot;A transferência só altera o responsável quando o destinatário autorizado aceita o pedido.&quot;, &quot;roles&quot;: &quot;Utilizador autenticado&quot;, &quot;steps&quot;: [&quot;Abra um Conjunto de Dados que pode modificar e que não esteja Arquivado nem Eliminado.&quot;, &quot;Seleccione Transferir o Conjunto de Dados.&quot;, &quot;No campo Organização ou utilizador, escolha o destinatário. Preencha Comentário se quiser contextualizar o pedido.&quot;, &quot;Reveja e confirme. O pedido fica Pendente e o responsável actual mantém-se.&quot;, &quot;O destinatário recebe um email e pode consultar, aceitar ou recusar o pedido, conforme as suas permissões.&quot;], &quot;example&quot;: &quot;Transfira um conteúdo pessoal para a organização que passará a ser responsável por o manter. A mudança concretiza-se após a aceitação.&quot;, &quot;tip&quot;: &quot;A aceitação preserva o estado, os metadados, os recursos e o histórico. Uma recusa mantém o responsável anterior. Pode cancelar antes de submeter o pedido.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Sequência do formulário de transferência e da decisão do destinatário.&quot;, &quot;next&quot;: &quot;Eliminar um Conjunto de Dados&quot;}, {&quot;title&quot;: &quot;Eliminar um Conjunto de Dados&quot;, &quot;intro&quot;: &quot;A eliminação é uma operação administrativa e não permite recuperação no portal.&quot;, &quot;roles&quot;: &quot;Administrador&quot;, &quot;steps&quot;: [&quot;Com perfil Administrador e a permissão aplicável, abra o Conjunto de Dados.&quot;, &quot;Seleccione a acção de eliminar e reveja o conteúdo identificado.&quot;, &quot;Confirme apenas se pretende concluir a eliminação.&quot;, &quot;Para consulta posterior autorizada, utilize o filtro Eliminados enquanto o registo existir.&quot;], &quot;example&quot;: &quot;Antes de eliminar um conteúdo criado por engano, confirme o título e o contexto para evitar actuar sobre outro Conjunto de Dados.&quot;, &quot;tip&quot;: &quot;O conteúdo deixa de ser público. A eliminação preserva os registos e o histórico, mas nenhum perfil dispõe de recuperação ou expurgo definitivo no portal.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura da confirmação de eliminação e do filtro Eliminados.&quot;, &quot;next&quot;: &quot;Voltar à visão geral&quot;}]}, {&quot;code&quot;: &quot;D05&quot;, &quot;title&quot;: &quot;Recursos de um Conjunto de Dados&quot;, &quot;intro&quot;: &quot;Disponibilize os dados através de ficheiros ou ligações e mantenha os recursos actualizados.&quot;, &quot;audience&quot;: &quot;Para gerir recursos, inicie sessão como Editor ou Administrador com permissão sobre o Conjunto de Dados.&quot;, &quot;fichas&quot;: [{&quot;title&quot;: &quot;Adicionar ficheiros&quot;, &quot;intro&quot;: &quot;Cada ficheiro aceite origina um recurso próprio.&quot;, &quot;roles&quot;: &quot;Editor ou Administrador&quot;, &quot;steps&quot;: [&quot;Aceda à gestão de recursos do Conjunto de Dados e seleccione a opção de adicionar.&quot;, &quot;Escolha carregar ficheiros e seleccione-os ou arraste-os para a área indicada.&quot;, &quot;Aguarde o resultado do carregamento.&quot;, &quot;Para cada recurso, preencha o título, o tipo e o formato, além do tipo de recurso e do ficheiro. A descrição é opcional.&quot;, &quot;Corrija os campos assinalados e conclua a operação.&quot;], &quot;example&quot;: &quot;Carregue dois ficheiros com dados de anos diferentes e atribua a cada recurso um título que identifique o ano correspondente.&quot;, &quot;tip&quot;: &quot;XML é admitido até 100 MB; os restantes tipos até 800 MB. SVG e HTML não são permitidos. O tamanho e o tipo MIME são preenchidos automaticamente quando disponíveis.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura do carregamento múltiplo e dos metadados de cada recurso.&quot;, &quot;next&quot;: &quot;Adicionar uma ligação&quot;}, {&quot;title&quot;: &quot;Adicionar uma ligação&quot;, &quot;intro&quot;: &quot;Use um recurso remoto quando os dados são disponibilizados noutro endereço.&quot;, &quot;roles&quot;: &quot;Editor ou Administrador&quot;, &quot;steps&quot;: [&quot;Na gestão de recursos, escolha adicionar um recurso remoto.&quot;, &quot;Indique a URL e preencha o título, o tipo e o formato aplicáveis.&quot;, &quot;Acrescente uma descrição, se necessário.&quot;, &quot;Reveja e conclua a operação.&quot;], &quot;example&quot;: &quot;Adicione a ligação para um ficheiro disponibilizado no sítio da entidade e use a descrição para explicar o seu conteúdo.&quot;, &quot;tip&quot;: &quot;Ligações externas, APIs e serviços de dados apresentam Não aplicável para validação. Adicionar a ligação não equivale a carregar o ficheiro no portal.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura de criação de recurso remoto com URL e metadados.&quot;, &quot;next&quot;: &quot;Editar metadados ou uma ligação&quot;}, {&quot;title&quot;: &quot;Editar metadados ou uma ligação&quot;, &quot;intro&quot;: &quot;Actualize a descrição do recurso ou o endereço de acesso quando necessário.&quot;, &quot;roles&quot;: &quot;Editor ou Administrador&quot;, &quot;steps&quot;: [&quot;Abra o recurso na área de gestão.&quot;, &quot;Altere o título, o tipo, a descrição ou o formato, conforme necessário.&quot;, &quot;Num recurso remoto, actualize a URL se o endereço mudou.&quot;, &quot;Reveja e guarde.&quot;], &quot;example&quot;: &quot;Se a entidade mudou o endereço de um ficheiro, actualize a ligação do recurso existente.&quot;, &quot;tip&quot;: &quot;Alterar apenas metadados não inicia nem invalida a validação aplicável ao ficheiro actual. Uma ligação remota continua com Não aplicável. Num Conjunto de Dados público, as alterações concluídas são imediatas.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura dos metadados e da alteração de URL.&quot;, &quot;next&quot;: &quot;Substituir o ficheiro de um recurso&quot;}, {&quot;title&quot;: &quot;Substituir o ficheiro de um recurso&quot;, &quot;intro&quot;: &quot;Substitua o conteúdo quando pretende actualizar o ficheiro do mesmo recurso.&quot;, &quot;roles&quot;: &quot;Editor ou Administrador&quot;, &quot;steps&quot;: [&quot;Abra o recurso e seleccione a substituição do ficheiro.&quot;, &quot;Escolha o novo ficheiro e aguarde o resultado do carregamento.&quot;, &quot;Se o novo ficheiro for elegível e existir modelo anterior, decida se pretende seleccionar Herdar modelo de validação. A opção começa desmarcada.&quot;, &quot;Conclua a substituição e confira o estado da validação.&quot;], &quot;example&quot;: &quot;Ao substituir um CSV actualizado, seleccione Herdar modelo de validação se pretende conservar a versão e a configuração do modelo anterior. O novo conteúdo fica Por validar.&quot;, &quot;tip&quot;: &quot;O ficheiro novo nunca herda o resultado anterior. Sem herança fica Sem modelo; se não for elegível, fica Não aplicável. A validação tem de ser solicitada. Se a substituição falhar, o conteúdo anterior mantém-se.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura da substituição, da herança desmarcada e do estado resultante.&quot;, &quot;next&quot;: &quot;Remover um recurso&quot;}, {&quot;title&quot;: &quot;Remover um recurso&quot;, &quot;intro&quot;: &quot;Confirme qual o recurso que pretende retirar antes de concluir.&quot;, &quot;roles&quot;: &quot;Editor ou Administrador&quot;, &quot;steps&quot;: [&quot;Abra a lista de recursos do Conjunto de Dados.&quot;, &quot;Seleccione a remoção do recurso pretendido.&quot;, &quot;Reveja a confirmação e confirme a operação.&quot;, &quot;Verifique que o recurso deixou de constar da lista.&quot;], &quot;example&quot;: &quot;Se adicionou o mesmo ficheiro duas vezes, identifique o recurso duplicado antes de o remover.&quot;, &quot;tip&quot;: &quot;Cancelar a confirmação mantém o recurso. Remover o último recurso não altera automaticamente o estado do Conjunto de Dados.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura da confirmação de remoção.&quot;, &quot;next&quot;: &quot;Consultar o recurso disponibilizado&quot;}, {&quot;title&quot;: &quot;Consultar o recurso disponibilizado&quot;, &quot;intro&quot;: &quot;Verifique como os dados são apresentados a quem os consulta.&quot;, &quot;roles&quot;: &quot;&quot;, &quot;steps&quot;: [&quot;Abra o detalhe do Conjunto de Dados e aceda a Ficheiros.&quot;, &quot;No recurso pretendido, seleccione Ver mais.&quot;, &quot;Consulte Metadados e Downloads e, quando apresentados, Pré-visualização e Estrutura de dados.&quot;, &quot;Use Explorar dados quando a acção estiver disponível.&quot;], &quot;example&quot;: &quot;Depois de actualizar um ficheiro, confirme o título, os metadados e a opção de acesso apresentada no detalhe.&quot;, &quot;tip&quot;: &quot;A pré-visualização simples suporta CSV, TSV, XLS, XLSX e ODS, mas depende da obtenção e leitura do conteúdo. O Explorador e o Validador têm condições próprias. A ausência de validação não bloqueia, por si só, o acesso.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura de recurso com pré-visualização e outro apenas com Metadados e Downloads.&quot;, &quot;next&quot;: &quot;Voltar à visão geral&quot;}]}, {&quot;code&quot;: &quot;D06&quot;, &quot;title&quot;: &quot;Explorador de dados&quot;, &quot;intro&quot;: &quot;Consulte uma tabela, aplique filtros, crie gráficos e exporte a informação apresentada.&quot;, &quot;audience&quot;: &quot;Aceda ao recurso que pretende consultar. A opção Explorar dados depende da disponibilidade do conteúdo e das permissões de acesso.&quot;, &quot;fichas&quot;: [{&quot;title&quot;: &quot;Abrir o Explorador&quot;, &quot;intro&quot;: &quot;Entre a partir do recurso que pretende analisar.&quot;, &quot;roles&quot;: &quot;&quot;, &quot;steps&quot;: [&quot;No detalhe do recurso, seleccione Explorar dados, quando disponível.&quot;, &quot;Aguarde a abertura da área Dados.&quot;, &quot;Navegue entre Dados, Estrutura, Métricas e Gráfico.&quot;], &quot;example&quot;: &quot;Abra um recurso tabular sobre transportes para consultar os registos antes de escolher os filtros.&quot;, &quot;tip&quot;: &quot;O Explorador suporta CSV, TXT tabular delimitado, XLS e XLSX após processamento bem-sucedido e disponibilização dos dados. Nos ficheiros Excel, apresenta a folha disponibilizada pelo processamento, sem selector de folhas.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura da entrada e das quatro áreas do Explorador.&quot;, &quot;next&quot;: &quot;Filtrar os resultados&quot;}, {&quot;title&quot;: &quot;Filtrar os resultados&quot;, &quot;intro&quot;: &quot;Os filtros restringem os Dados e o Gráfico. A Estrutura e as Métricas continuam a representar o recurso completo.&quot;, &quot;roles&quot;: &qu  desde que tenha acesso ao recurso.&quot;, &quot;tip&quot;: &quot;A ligação não concede permissões nem fixa uma cópia dos dados. Após uma actualização do recurso, configurações incompatíveis podem ser removidas, com informação ao utilizador.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Captura de uma exploração configurada e do endereço para partilha.&quot;, &quot;next&quot;: &quot;Resolver ausência de resultados ou indisponibilidade&quot;}, {&quot;title&quot;: &quot;Resolver ausência de resultados ou indisponibilidade&quot;, &quot;intro&quot;: &quot;Identifique a situação apresentada antes de tentar novamente.&quot;, &quot;roles&quot;: &quot;&quot;, &quot;steps&quot;: [&quot;Se os filtros não devolverem resultados, altere os critérios ou seleccione Limpar.&quot;, &quot;Se um filtro for inválido, corrija o campo indicado.&quot;, &quot;Se ocorrer uma falha temporária, seleccione Tentar novamente.&quot;, &quot;Se o conteúdo estiver em processamento, volte a consultar quando os dados estiverem disponíveis.&quot;], &quot;example&quot;: &quot;Depois de substituir um ficheiro, o Explorador pode ficar indisponível durante o novo processamento.&quot;, &quot;tip&quot;: &quot;Durante o reprocessamento, os dados anteriores não são apresentados como actuais. Recurso não encontrado, erro e pesquisa sem resultados são situações distintas.&quot;, &quot;table&quot;: null, &quot;media&quot;: &quot;Capturas dos estados sem resultados, em processamento e erro com nova tentativa.&quot;, &quot;next&quot;: &quot;Voltar à visão geral&quot;}]}, {&quot;code&quot;: &quot;D07&quot;, &quot;title&quot;: &quot;Qualidade e validação de dados&quot;, &quot;intro&quot;: &quot;Associe um modelo a um ficheiro tabular, execute a validação e interprete o resultado no contexto do conteúdo validado.&quot;, &quot;audience&quot;: &quot;Para associar modelos ou executar validações, inicie sessão como Editor ou Administrador com permissão sobre o Conjunto de Dados.&quot;, &quot;fichas&quot;: [{&quot;title&quot;: &quot;Compreender o resultado da validação&quot;, &quot;intro&quot;: &quot;A validação verifica se o ficheiro cumpre a estrutura, os tipos e as regras de uma versão do modelo.&quot;, &quot;roles&quot;: &quot;&quot;, &quot;steps&quot;: [&quot;Consulte o estado apresentado no recurso.&quot;, &quot;Quando existir resultado, confirme o ficheiro e a versão do modelo a que se aplica.&quot;, &quot;Interprete o resultado em conjunto com a descrição, a cobertura e a licença dos dados.&quot;], &quot;example&quot;: &quot;Um ficheiro pode estar Válido perante o modelo e, ainda assim, abranger um período diferente do que procura.&quot;, &quot;tip&quot;: &quot;Válido significa que o ficheiro cumpre as verificações do modelo. Não é uma garantia geral de qualidade ou adequação. A ausência de validação não impede, por si só, a publicação, consulta ou exploração.&quot;, &quot;table&quot;: [[&quot;Estado&quot;, &quot;Significado&quot;], [&quot;Não aplicável&quot;, &quot;O recurso não é elegível&quot;], [&quot;Sem modelo&quot;, &quot;É elegível, mas não tem modelo associado&quot;], [&quot;Por validar&quot;, &quot;Tem modelo, mas não tem resultado actual aplicável&quot;], [&quot;Em validação&quot;, &quot;A execução está em curso&quot;], [&quot;Válido&quot;, &quot;Cumpre as verificações do modelo&quot;], [&quot;Não conforme&quot;, &quot;Foi identificada pelo menos uma não conformidade&quot;], [&quot;Erro técnico&quot;, &quot;A execução não pôde ser concluída&quot;]], &quot;media&quot;: &quot;Captura de um resumo de validação aplicável ao conteúdo actual.&quot;, &quot;next&quot;: &quot;Associar um modelo de validação&quot;}, {&quot;title&quot;: &quot;Associar um modelo de validação&quot;, &quot;intro&quot;: &quot;A associação é opcional e identifica uma versão exacta do modelo.&quot;, &quot;roles&quot;: &quot;Editor ou Administrador&quot;, &quot;steps&quot;: [&quot;Abra a área de validação de um recurso elegível: ficheiro carregado em CSV, TXT tabular, XLS, XLSX ou ODS.&qu &lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = '.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]';
  const disabled = ':disabled,[aria-disabled=&quot;true&quot;]';
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest('[role=&quot;tablist&quot;]').querySelectorAll('[role=&quot;tab&quot;]')) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role=&quot;tablist&quot;]').querySelectorAll('[role=&quot;tab&quot;]'),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role=&quot;tablist&quot;]')) {
    const selected =
      list.querySelector('[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]') ??
      list.querySelector('[role=&quot;tab&quot;].active') ??
      list.querySelector('[role=&quot;tab&quot;]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
</script>
