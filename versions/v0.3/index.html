:root[data-theme="light"] {
  color-scheme: light;
}

:root[data-theme="dark"] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget > :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover,
.nav-link:not(:disabled):not([aria-disabled="true"]):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled="true"] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type="file"] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type="file"]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type="file"]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type="color"] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type="color"]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type="color"]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type="checkbox"]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type="checkbox"]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: "";
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type="radio"] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type="radio"]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: "";
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed="true"],
  [aria-selected="true"],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed="true"], [aria-selected="true"], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type="file"]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type="color"] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type="date"],
    [type="datetime-local"],
    [type="month"],
    [type="time"],
    [type="week"]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: "";
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {

  max-width: 100%;
  height: auto;
}

#widget > svg {

}

  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;

}

}

ão e outro apenas com Metadados e Downloads.", "next": "Voltar à visão geral"}]}, {"code": "D06", "title": "Explorador de dados", "intro": "Consulte uma tabela, aplique filtros, crie gráficos e exporte a informação apresentada.", "audience": "Aceda ao recurso que pretende consultar. A opção Explorar dados depende da disponibilidade do conteúdo e das permissões de acesso.", "fichas": [{"title": "Abrir o Explorador", "intro": "Entre a partir do recurso que pretende analisar.", "roles": "", "steps": ["No detalhe do recurso, seleccione Explorar dados, quando disponível.", "Aguarde a abertura da área Dados.", "Navegue entre Dados, Estrutura, Métricas e Gráfico."], "example": "Abra um recurso tabular sobre transportes para consultar os registos antes de escolher os filtros.", "tip": "O Explorador suporta CSV, TXT tabular delimitado, XLS e XLSX após processamento bem-sucedido e disponibilização dos dados. Nos ficheiros Excel, apresenta a folha disponibilizada pelo processamento, sem selector de folhas.", "table": null, "media": "Captura da entrada e das quatro áreas do Explorador.", "next": "Filtrar os resultados"}, {"title": "Filtrar os resultados", "intro": "Os filtros restringem os Dados e o Gráfico. A Estrutura e as Métricas continuam a representar o recurso completo.", "roles": "", "steps": ["Em qualquer área, seleccione Filtrar Resultados.", "Escolha os filtros das colunas pretendidas e preencha os valores no formato indicado.", "Aplique os filtros e consulte os resultados.", "Para remover todos os filtros, incluindo os de colunas ocultas, seleccione Limpar."], "example": "Num recurso com município e data, filtre um município e uma data. Os resultados têm de cumprir as duas condições.", "tip": "Os filtros combinam-se por “e”. Ocultar uma coluna não retira o seu filtro. Limpar remove os filtros, mas mantém a visibilidade das colunas. Para uma data, use o formato YYYY-MM-DD, como 2026-08-01.", "table": null, "media": "Captura do painel com dois filtros e da acção Limpar.", "next": "Ordenar e escolher as colunas"}, {"title": "Ordenar e escolher as colunas", "intro": "Adapte a tabela ao que precisa de consultar.", "roles": "", "steps": ["Na área Dados, escolha a coluna pela qual pretende ordenar.", "Defina as colunas que quer manter visíveis.", "Escolha 10, 50 ou 200 registos por página.", "Percorra as páginas para consultar os restantes resultados."], "example": "Mantenha visíveis apenas o município, a data e o valor que pretende analisar, e ordene pela data.", "tip": "A ordenação utiliza uma coluna de cada vez. A tabela inicia com 10 registos por página. Os filtros de colunas ocultas continuam activos.", "table": null, "media": "Captura da selecção de colunas, ordenação e paginação.", "next": "Consultar a estrutura e as métricas"}, {"title": "Consultar a estrutura e as métricas", "intro": "Conheça as colunas e os indicadores disponíveis para o recurso completo.", "roles": "", "steps": ["Abra Estrutura para consultar a identificação do recurso, os campos e os tipos e formatos disponibilizados.", "Abra Métricas para consultar os indicadores globais e por coluna existentes.", "Confirme o significado e a disponibilidade de cada indicador antes de o interpretar."], "example": "Mesmo que filtre um município na tabela, as métricas continuam a descrever o recurso completo.", "tip": "Uma métrica não disponível não significa zero. As métricas podem ajudar a compreender os dados, mas esta área não produz alertas automáticos de qualidade.", "table": null, "media": "Captura de Estrutura e Métricas com o âmbito completo identificado.", "next": "Criar e guardar um gráfico"}, {"title": "Criar e guardar um gráfico", "intro": "O gráfico representa os registos da página actual, até 200.", "roles": "", "steps": ["Abra Gráfico e escolha o tipo pretendido.", "Seleccione os eixos e as séries entre as colunas compatíveis. Em Bolhas, escolha também a coluna numérica para o raio.", "Ajuste os filtros e a paginação para seleccionar os registos representados.", "Use o modo de ecrã inteiro para ampliar ou exporte o gráfico em PNG."], "example": "Para comparar valores entre municípios presentes na página actual, escolha Barras e configure as colunas de município e valor.", "tip": "Os gráficos não calculam Soma ou Contagem. Anel, Circular e Área polar usam uma série de valores. Para sair do ecrã inteiro, use o controlo disponível ou Esc. Pode consultar a informação na tabela.", "table": [["Tipos disponíveis", "Utilização das colunas"], ["Linha, Barras e Radar", "Dimensão ou categorias e valores numéricos"], ["Anel, Circular e Área polar", "Categorias e uma série de valores"], ["Dispersão", "Eixos numéricos"], ["Bolhas", "Eixos numéricos e valor numérico para o raio"]], "media": "Captura do gráfico configurado, paginação e exportação PNG.", "next": "Exportar os dados apresentados"}, {"title": "Exportar os dados apresentados", "intro": "A exportação do Explorador inclui apenas a página actual e as colunas visíveis.", "roles": "", "steps": ["Ajuste os filtros, a ordenação, a página e as colunas visíveis.", "Em Dados, Estrutura, Métricas ou Gráfico, seleccione Exportar CSV ou Exportar JSON.", "Guarde o ficheiro e confirme o conteúdo exportado."], "example": "Se a página apresenta 50 registos e três colunas visíveis, a exportação contém esses registos e essas três colunas.", "tip": "Para obter o ficheiro original completo, regresse ao detalhe do recurso e consulte Downloads, quando disponível. Exportar a partir de Métricas não exporta as métricas.", "table": null, "media": "Captura da exportação com a página e as colunas visíveis assinaladas.", "next": "Guardar ou partilhar uma exploração"}, {"title": "Guardar ou partilhar uma exploração", "intro": "Guarde o endereço para retomar a configuração suportada sobre o conteúdo disponível.", "roles": "", "steps": ["Configure a área, os filtros, a ordenação, a página, as colunas e, se necessário, o gráfico.", "Copie o endereço do navegador.", "Guarde ou partilhe a ligação e volte a abri-la para retomar a exploração."], "example": "Partilhe a ligação depois de filtrar um município para que outro utilizador possa abrir essa configuração, desde que tenha acesso ao recurso.", "tip": "A ligação não concede permissões nem fixa uma cópia dos dados. Após uma actualização do recurso, configurações incompatíveis podem ser removidas, com informação ao utilizador.", "table": null, "media": "Captura de uma exploração configurada e do endereço para partilha.", "next": "Resolver ausência de resultados ou indisponibilidade"}, {"title": "Resolver ausência de resultados ou indisponibilidade", "intro": "Identifique a situação apresentada antes de tentar novamente.", "roles": "", "steps": ["Se os filtros não devolverem resultados, altere os critérios ou seleccione Limpar.", "Se um filtro for inválido, corrija o campo indicado.", "Se ocorrer uma falha temporária, seleccione Tentar novamente.", "Se o conteúdo estiver em processamento, volte a consultar quando os dados estiverem disponíveis."], "example": "Depois de substituir um ficheiro, o Explorador pode ficar indisponível durante o novo processamento.", "tip": "Durante o reprocessamento, os dados anteriores não são apresentados como actuais. Recurso não encontrado, erro e pesquisa sem resultados são situações distintas.", "table": null, "media": "Capturas dos estados sem resultados, em processamento e erro com nova tentativa.", "next": "Voltar à visão geral"}]}, {"code": "D07", "title": "Qualidade e validação de dados", "intro": "Associe um modelo a um ficheiro tabular, execute a validação e interprete o resultado no contexto do conteúdo validado.", "audience": "Para associar modelos ou executar validações, inicie sessão como Editor ou Administrador com permissão sobre o Conjunto de Dados.", "fichas": [{"title": "Compreender o resultado da validação", "intro": "A validação verifica se o ficheiro cumpre a estrutura, os tipos e as regras de uma versão do modelo.", "roles": "", "steps": ["Consulte o estado apresentado no recurso.", "Quando existir resultado, confirme o ficheiro e a versão do modelo a que se aplica.", "Interprete o resultado em conjunto com a descrição, a cobertura e a licença dos dados."], "example": "Um ficheiro pode estar Válido perante o modelo e, ainda assim, abranger um período diferente do que procura.", "tip": "Válido significa que o ficheiro cumpre as verificações do modelo. Não é uma garantia geral de qualidade ou adequação. A ausência de validação não impede, por si só, a publicação, consulta ou exploração.", "table": [["Estado", "Significado"], ["Não aplicável", "O recurso não é elegível"], ["Sem modelo", "É elegível, mas não tem modelo associado"], ["Por validar", "Tem modelo, mas não tem resultado actual aplicável"], ["Em validação", "A execução está em curso"], ["Válido", "Cumpre as verificações do modelo"], ["Não conforme", "Foi identificada pelo menos uma não conformidade"], ["Erro técnico", "A execução não pôde ser concluída"]], "media": "Captura de um resumo de validação aplicável ao conteúdo actual.", "next": "Associar um modelo de validação"}, {"title": "Associar um modelo de validação", "intro": "A associação é opcional e identifica uma versão exacta do modelo.", "roles": "Editor ou Administrador", "steps": ["Abra a área de validação de um recurso elegível: ficheiro carregado em CSV, TXT tabular, XLS, XLSX ou ODS.", "Escolha um modelo Activo e a versão Em vigor disponibilizada.", "Reveja Validar a ordem das colunas, activa por defeito.", "Confirme a associação. O recurso fica Por validar."], "example": "Associe um modelo com as colunas esperadas para os dados de transportes que está a disponibilizar.", "tip": "Se desactivar a validação da ordem, as colunas são comparadas pelo nome. Colunas em falta ou adicionais continuam a ser não conformidades. Ligações externas, APIs e serviços de dados não são elegíveis.", "table": null, "media": "Captura do selector de modelo, versão e ordem das colunas.", "next": "Executar a validação"}, {"title": "Executar a validação", "intro": "A validação começa quando a solicita. Carregar ou editar o recurso não a inicia automaticamente.", "roles": "Editor ou Administrador", "steps": ["Confirme que o recurso tem um modelo associado.", "Seleccione a acção de validar.", "Acompanhe o estado Em validação.", "Consulte o resultado final e o detalhe disponível."], "example": "Depois de associar o modelo, execute a validação para verificar se o ficheiro cumpre as regras seleccionadas.", "tip": "Não conforme e Erro técnico não bloqueiam a gestão do recurso nem a publicação ou actualização do Conjunto de Dados. Um erro técnico não é um resultado de conformidade.", "table": null, "media": "Sequência Por validar, Em validação e resultado final.", "next": "Tratar não conformidades ou erros"}, {"title": "Tratar não conformidades ou erros", "intro": "Use o detalhe disponível para decidir o que precisa de corrigir.", "roles": "Editor ou Administrador", "steps": ["Se o resultado for Não conforme, consulte as colunas, regras ou ocorrências identificadas, quando disponíveis.", "Confirme se o ficheiro ou o modelo escolhido precisa de correcção.", "Se corrigiu o ficheiro fora do portal, substitua-o e confirme a associação de modelo.", "Solicite uma nova validação. Perante Erro técnico, pode tentar novamente."], "example": "Se faltar uma coluna exigida pelo modelo, corrija o ficheiro ou confirme se associou o modelo adequado antes de repetir a validação.", "tip": "Uma substituição bem-sucedida retira ao resultado anterior o carácter de resultado actual. Herdar o modelo conserva a versão e a configuração, mas exige uma nova validação.", "table": null, "media": "Captura de não conformidade e erro técnico, sem prometer detalhe que não esteja disponível.", "next": "Alterar ou remover o modelo associado"}, {"title": "Alterar ou remover o modelo associado", "intro": "Altere a associação quando pretende validar o recurso com outra definição.", "roles": "Editor ou Administrador", "steps": ["Abra a associação de modelo do recurso.", "Para a alterar, seleccione um modelo Activo e a versão Em vigor disponibilizada.", "Confirme a nova associação e solicite a validação quando necessário.", "Para deixar de utilizar um modelo, remova a associação."], "example": "Se foi disponibilizada uma nova versão adequada ao recurso, seleccione-a explicitamente para passar a validar com essa definição.", "tip": "Alterar a associação coloca o recurso em Por validar. Removê-la coloca-o em Sem modelo. As versões novas e a inactivação de um modelo não alteram automaticamente associações existentes.", "table": null, "media": "Captura da alteração e remoção da associação.", "next": "Consultar o histórico de validações"}, {"title": "Consultar o histórico de validações", "intro": "Cada execução fica ligada ao ficheiro e à versão do modelo utilizados nessa validação.", "roles": "Editor ou Administrador", "steps": ["Abra o histórico de validação do recurso.", "Identifique a execução pela data, ficheiro, modelo e versão.", "Consulte o resultado e as não conformidades disponíveis.", "Distinga o resultado aplicável ao conteúdo actual dos resultados históricos."], "example": "Depois de substituir um CSV, consulte a execução anterior para perceber quais as verificações feitas sobre o ficheiro substituído.", "tip": "Alterar apenas os metadados mantém a validação aplicável ao ficheiro. Uma execução antiga que termine após a substituição não passa a validar o novo conteúdo.", "table": null, "media": "Captura do histórico com data, ficheiro, modelo, versão e resultado.", "next": "Voltar à visão geral"}]}, {"code": "D08", "title": "APIs e serviços de dados", "intro": "Consulte a API do dados.gov.pt, conheça as APIs registadas no catálogo e prepare a publicação e manutenção da API da sua organização.", "audience": "Para pessoas que integram dados em aplicações e membros de organizações que pretendem registar uma API no portal.", "fichas": [{"title": "Escolher a API adequada", "intro": "A API do portal dá acesso programático ao catálogo. Uma API registada no catálogo tem o seu próprio endereço e documentação, que deve consultar antes de a utilizar.", "roles": "Consulta pública", "steps": ["Se pretende consultar ou integrar informação do catálogo, abra a referência da API do dados.gov.pt na área de desenvolvimento.", "Se procura uma API disponibilizada por uma entidade, consulte o seu registo no catálogo.", "Leia a descrição e a documentação associada para confirmar se a API responde à sua necessidade.", "Distinga o endereço da página no portal da URL base usada para comunicar com a API."], "example": "Uma equipa consulta a API do portal para recolher metadados do catálogo. Para usar um serviço de uma entidade, consulta a documentação ligada ao respectivo registo.", "tip": "Registar uma API no catálogo não substitui a preparação e disponibilização do serviço pela entidade responsável.", "table": null, "media": "Referência da API do portal e registo de uma API, com os destinos identificados.", "next": "Consultar a referência da API do portal."}, {"title": "Consultar a referência da API do portal", "intro": "A referência permite identificar as operações disponíveis, os parâmetros e a informação devolvida.", "roles": "Consulta pública e utilizador autenticado para escrita", "steps": ["Abra a referência da API do portal e consulte a documentação interactiva ou a ligação para Swagger.", "Localize a operação pretendida e leia os parâmetros e a estrutura da resposta.", "Para leitura de informação pública, siga a operação de consulta documentada. Quando a resposta for paginada, consulte as páginas seguintes indicadas na própria resposta.", "Para operações de escrita, obtenha uma chave nas definições do perfil e forneça-a no cabeçalho X-API-KEY. As permissões da conta continuam a aplicar-se.", "Se precisar da definição da API nas suas ferramentas, utilize a opção de descarregar a especificação OpenAPI em JSON."], "example": "Uma equipa consulta os metadados de organizações e percorre as páginas devolvidas para obter os restantes resultados.", "tip": "Guarde a chave de forma reservada. Não a inclua em exemplos partilhados, capturas ou pedidos de apoio.", "table": null, "media": "Referência e ligação para Swagger. Não mostrar uma chave real.", "next": "Consultar uma API do catálogo."}, {"title": "Consultar uma API do catálogo", "intro": "O registo reúne a descrição da API e as ligações que ajudam a compreender o serviço e os dados associados.", "roles": "Consulta pública", "steps": ["Abra o detalhe da API que pretende conhecer.", "Leia a descrição, a documentação funcional e a informação de acesso apresentada.", "Consulte a URL base e, quando disponível, a documentação Swagger para preparar a integração.", "Na área de informações, abra os Conjuntos de Dados associados que pretende consultar.", "Consulte as informações técnicas do registo, incluindo identificador, data de criação e última actualização."], "example": "Uma pessoa abre o detalhe de uma API e consulta um dos Conjuntos de Dados relacionados antes de preparar a integração.", "tip": "A data de actualização do registo não confirma, por si só, a actualização de todos os dados devolvidos pelo serviço.", "table": null, "media": "Detalhe com informações técnicas, documentação e dados relacionados.", "next": "Preparar e registar uma API."}, {"title": "Preparar e registar uma API", "intro": "A criação de uma API no catálogo é feita em nome de uma organização com o emblema Serviço público da qual o utilizador seja membro. Esta regra também se aplica a administradores do portal.", "roles": "Membro de organização com emblema Serviço público", "steps": ["Confirme que pertence à organização que vai publicar a API e que esta tem o emblema Serviço público.", "Prepare a descrição do serviço, a URL base, as ligações de documentação e as condições de acesso.", "Inicie a criação de uma API e seleccione a organização elegível no campo Produtor.", "Preencha a informação pedida no formulário. No tipo de acesso, escolha Aberto, Aberto com conta ou Restrito de acordo com o serviço. Para acesso restrito, prepare as audiências, condições e motivo da restrição.", "No passo de associação de Conjuntos de Dados, seleccione os que correspondem ao serviço. Esta associação é opcional.", "No passo final, escolha guardar como rascunho ou publicar. Consulte a listagem para confirmar o resultado."], "example": "Uma organização com o emblema Serviço público prepara o registo da sua API, associa um Conjunto de Dados e guarda o rascunho para revisão interna.", "tip": "Confirme o produtor e a informação guardada antes de publicar. A regra de criação não altera retroactivamente as APIs pessoais já existentes.", "table": null, "media": "Produtor com organização fictícia, campos de acesso e decisão final entre rascunho e publicação.", "next": "Actualizar uma API e os dados associados."}, {"title": "Actualizar uma API e os dados associados", "intro": "Mantenha o registo alinhado com o serviço e reveja as ligações aos Conjuntos de Dados.", "roles": "Utilizador com acesso à edição da API", "steps": ["Localize a API na sua área de gestão e abra a edição.", "Reveja o formulário preenchido e actualize a descrição, URL base, documentação ou outras informações que mudaram.", "Na secção Conjuntos de dados associados, pesquise e seleccione os conjuntos que pretende acrescentar.", "Para retirar uma associação, remova o conjunto da selecção.", "Guarde e volte a abrir o registo para confirmar as alterações e os dados associados."], "example": "Uma entidade actualiza a documentação funcional da API e acrescenta à selecção um Conjunto de Dados que passou a ser disponibilizado pelo serviço.", "tip": "A remoção de um conjunto da selecção altera a associação ao registo da API. Não use esta acção como procedimento de eliminação do Conjunto de Dados.", "table": null, "media": "Edição com dados associados apresentados como elementos removíveis e acção Guardar.", "next": "Resolver dificuldades com uma API."}, {"title": "Resolver dificuldades com uma API", "intro": "Identifique se o problema afecta o registo no portal, as permissões da conta ou a comunicação com o serviço.", "roles": "Utilizador da API ou editor do registo", "steps": ["Se não consegue criar uma API, confirme a pertença à organização e o emblema Serviço público.", "Se uma chamada à API do portal falhar, compare a operação com a referência e confirme a chave e as permissões quando forem necessárias.", "Se o problema ocorrer numa API do catálogo, consulte a documentação indicada no seu registo para verificar o endereço e as condições de acesso.", "Se uma alteração ao registo não ficar guardada, registe a página, a acção e a mensagem apresentada.", "Ao pedir apoio, indique qual a API afectada e descreva o resultado esperado e o observado, omitindo credenciais e dados pessoais desnecessários."], "example": "Um editor não consegue iniciar a criação de uma API. Confirma que a organização seleccionada ainda não tem o emblema exigido.", "tip": "Não confunda a chave da API do portal com credenciais eventualmente exigidas por outro serviço.", "table": null, "media": "Exemplo de reporte sem credenciais nem dados pessoais reais.", "next": "Organizações e permissões ou Ajuda e contactos."}]}, {"code": "D09", "title": "Reutilizações", "intro": "Encontre trabalhos baseados em dados e prepare, publique ou actualize uma reutilização no portal.", "audience": "Para pessoas que consultam reutilizações e utilizadores que publicam trabalhos em nome próprio ou no contexto de uma organização.", "fichas": [{"title": "Encontrar e consultar reutilizações", "intro": "Conheça os trabalhos que reutilizam dados.", "roles": "Consulta pública", "steps": ["Abra a página de Reutilizações e pesquise pelo assunto pretendido.", "Reveja os termos e filtros quando precisar de ajustar os resultados.", "Abra uma reutilização e leia a descrição e as etiquetas apresentadas.", "Consulte os dados e as ligações disponibilizadas para compreender  function next(g,f){

  if(gi>=0)return {gi,fi:-1,label:guides[gi].title+(!guides[gi].fichas.length?' (pendente)':'')};
  const fi=state.ficha+1;

 root.addEventListener('click',e=>{
  const themeButton=e.target.closest('[data-theme-target]');
  if(themeButton){if(!state.home){state.home=true;render();requestAnimationFrame(()=>scrollToTheme(themeButton.dataset.themeTarget));}else scrollToTheme(themeButton.dataset.themeTarget);return;}
  const b=e.target.closest('button[data-ficha]');if(!b)return;
  if(b.dataset.guide!==undefined){openGuide(Number(b.dataset.guide),Number(b.dataset.ficha));return;}
  state.home=false;state.ficha=Number(b.dataset.ficha);render();
 });
 $('#dg-guide').addEventListener('change',e=>openGuide(Number(e.target.value),-1));
 $('#dg-ficha').addEventListener('change',e=>{if(state.home){if(e.target.value)scrollToTheme(e.target.value);return;}state.ficha=Number(e.target.value);render();});
 $('.dg-all').addEventListener('click',()=>{state.home=true;state.ficha=-1;$('#dg-query').value='';render();});
 function search(){
  const q=$('#dg-query').value.trim();if(!q){render();return;}
  state.home=false;
  const hits=[];guides.forEach((g,gi)=>g.fichas.forEach((f,i)=>{if(normal(f.title+' '+f.intro+' '+f.steps.join(' ')+' '+f.tip).includes(normal(q)))hits.push({f,i,gi,theme:themeForCode(g.code)});}));
  navHome();
  const grouped=themes.map(t=>({theme:t,hits:hits.filter(h=>h.theme?.id===t.id)})).filter(x=>x.hits.length);
  $('main').innerHTML=`<div class="dg-breadcrumb">Pesquisa nos guias disponíveis</div><h1>Resultados da pesquisa</h1><p>${hits.length} ${hits.length===1?'ficha encontrada':'fichas encontradas'} para “${esc(q)}”.</p>${hits.length?grouped.map(x=>`<h2 class="dg-search-theme">${esc(x.theme.title)}</h2><div class="dg-grid">${x.hits.map(h=>card(h.f,h.i,h.gi)).join('')}</div>`).join(''):'<p>Experimente menos palavras ou outra expressão.</p>'}`;
 }
 $('.dg-search button').type='button';
 $('.dg-search button').addEventListener('click',search);
 $('#dg-query').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search();}});
 $('.dg-search').addEventListener('submit',e=>{e.preventDefault();search();});
 render();
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(design,'grid',{label:'Apresentação das tarefas',options:['Cartões','Lista']});tweak.addToggle(design,'showMedia',{label:'Mostrar espaço previsto para imagens'});}
})();
</script>
